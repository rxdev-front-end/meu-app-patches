workflows:
  ios-workflow:
    name: iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Unzip Project
        script: |
          unzip 3105-interface-customizada.zip -d unzipped_project
      - name: Build and Export IPA
        script: |
          cd unzipped_project/3105-interface-customizada
          xcodebuild -project ThreeOneOSFive.xcodeproj -scheme "ThreeOneOSFive" -sdk iphoneos -configuration Release archive -archivePath $CM_BUILD_DIR/build/App.xcarchive CODE_SIGNING_ALLOWED=NO
          mkdir -p $CM_BUILD_DIR/build/Payload
          cp -r $CM_BUILD_DIR/build/App.xcarchive/Products/Applications/*.app $CM_BUILD_DIR/build/Payload/
          cd $CM_BUILD_DIR/build
          zip -r App-unsigned.ipa Payload
    artifacts:
      - build/App-unsigned.ipa
