workflows:
  ios-workflow:
    name: iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Unzip and Build IPA
        script: |
          set -e
          
          echo "1. Descompactando..."
          unzip -o 3105-interface-customizada.zip -d unzipped_project
          
          echo "2. Procurando o projeto..."
          PROJECT_PATH=$(find unzipped_project -name "*.xcodeproj" -type d | head -n 1)
          PROJECT_DIR=$(dirname "$PROJECT_PATH")
          PROJECT_NAME=$(basename "$PROJECT_PATH" .xcodeproj)
          
          echo "3. Listando os esquemas disponiveis:"
          cd "$PROJECT_DIR"
          xcodebuild -list -project "$PROJECT_NAME.xcodeproj"
          
          echo "4. Compilando..."
          xcodebuild -project "$PROJECT_NAME.xcodeproj" -scheme "$PROJECT_NAME" -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' archive -archivePath $CM_BUILD_DIR/build/App.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          
          echo "5. Empacotando..."
          mkdir -p $CM_BUILD_DIR/build/Payload
          cp -r $CM_BUILD_DIR/build/App.xcarchive/Products/Applications/*.app $CM_BUILD_DIR/build/Payload/
          cd $CM_BUILD_DIR/build
          zip -r App-unsigned.ipa Payload
    artifacts:
      - build/App-unsigned.ipa
