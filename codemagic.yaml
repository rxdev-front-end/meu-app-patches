workflows:
  ios-workflow:
    name: Lucchese Store 3106 - unsigned IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_SCHEME: "3106"
    scripts:
      - name: Verify Xcode project and shared scheme
        script: |
          set -euo pipefail
          PROJECT_PATH="$(find "$CM_BUILD_DIR" -maxdepth 8 -type d -name 'ThreeOneOSSix.xcodeproj' -print -quit)"
          if [ -z "$PROJECT_PATH" ]; then
            echo "ERROR: ThreeOneOSSix.xcodeproj not found under $CM_BUILD_DIR"
            echo "Xcode projects found:"
            find "$CM_BUILD_DIR" -maxdepth 8 -type d -name '*.xcodeproj' -print || true
            exit 1
          fi
          echo "Using Xcode project: $PROJECT_PATH"
          xcodebuild -list -project "$PROJECT_PATH"
          xcodebuild -showBuildSettings \
            -project "$PROJECT_PATH" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release >/dev/null
      - name: Archive for generic iOS device without signing
        script: |
          set -euo pipefail
          PROJECT_PATH="$(find "$CM_BUILD_DIR" -maxdepth 8 -type d -name 'ThreeOneOSSix.xcodeproj' -print -quit)"
          if [ -z "$PROJECT_PATH" ]; then
            echo "ERROR: ThreeOneOSSix.xcodeproj not found under $CM_BUILD_DIR"
            find "$CM_BUILD_DIR" -maxdepth 8 -type d -name '*.xcodeproj' -print || true
            exit 1
          fi
          ARCHIVE_DIR="$CM_BUILD_DIR/build/ios/xcarchive"
          ARCHIVE_PATH="$ARCHIVE_DIR/LuccheseStore.xcarchive"
          DERIVED_DATA="$CM_BUILD_DIR/build/ios/DerivedData"
          mkdir -p "$ARCHIVE_DIR" "$DERIVED_DATA"
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive
      - name: Package unsigned IPA artifact
        script: |
          set -euo pipefail
          ARCHIVE_PATH="$CM_BUILD_DIR/build/ios/xcarchive/LuccheseStore.xcarchive"
          APP_DIR="$ARCHIVE_PATH/Products/Applications"
          APP_PATH="$(find "$APP_DIR" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: no .app product found in $APP_DIR"
            ls -la "$APP_DIR" || true
            exit 1
          fi
          APP_NAME="$(basename "$APP_PATH")"
          PACKAGE_DIR="$CM_BUILD_DIR/build/ios/package"
          IPA_DIR="$CM_BUILD_DIR/build/ios/ipa"
          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR/Payload" "$IPA_DIR"
          ditto "$APP_PATH" "$PACKAGE_DIR/Payload/$APP_NAME"
          rm -f "$IPA_DIR/LuccheseStore-unsigned.ipa"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "$PACKAGE_DIR/Payload" \
            "$IPA_DIR/LuccheseStore-unsigned.ipa"
          /usr/bin/unzip -t "$IPA_DIR/LuccheseStore-unsigned.ipa"
          /usr/bin/unzip -Z1 "$IPA_DIR/LuccheseStore-unsigned.ipa" \
            | grep -q "^Payload/$APP_NAME/Info.plist$"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
