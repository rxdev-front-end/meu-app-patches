workflows:
  ios-workflow:
    name: iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Unzip and Build IPA
        script: |
          set -e # Para o script imediatamente se der qualquer erro
          
          echo "1. Descompactando o arquivo..."
          unzip -o 3105-interface-customizada.zip -d unzipped_project
          
          echo "2. Procurando o arquivo .xcodeproj..."
          PROJECT_PATH=$(find unzipped_project -name "*.xcodeproj" -type d | head -n 1)
          
          if [ -z "$PROJECT_PATH" ]; then
            echo "ERRO FATAL: Nenhum arquivo .xcodeproj encontrado dentro do ZIP!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$PROJECT_PATH")
          PROJECT_NAME=$(basename "$PROJECT_PATH" .xcodeproj)
          
          echo "Projeto encontrado: $PROJECT_NAME na pasta $PROJECT_DIR"
          
          echo "3. Iniciando compilacao com Xcode..."
          cd "$PROJECT_DIR"
          
          # O comando que realmente compila o app
          xcodebuild -project "$PROJECT_NAME.xcodeproj" -scheme "$PROJECT_NAME" -sdk iphoneos -configuration Release archive -archivePath $CM_BUILD_DIR/build/App.xcarchive CODE_SIGNING_ALLOWED=NO
          
          echo "4. Empacotando o IPA..."
          mkdir -p $CM_BUILD_DIR/build/Payload
          cp -r $CM_BUILD_DIR/build/App.xcarchive/Products/Applications/*.app $CM_BUILD_DIR/build/Payload/
          
          cd $CM_BUILD_DIR/build
          zip -r App-unsigned.ipa Payload
          
          echo "Build finalizado com sucesso!"
    artifacts:
      - build/App-unsigned.ipa
